name: pages

# Publishes the catalog extractor page (web/) with HXtra's firmware tools at a pinned commit.
# No firmware and no catalog is part of the site: the page reads the user's own file in the browser.
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/catalog/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HXTRA_REF: 01708b45004cc2a232e32e8e9020a3237fdad06d

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wisemandenny/hxtra
          ref: ${{ env.HXTRA_REF }}
          path: hxtra
      - name: site
        run: python3 web/build_site.py hxtra _site --hxtra-commit "$HXTRA_REF"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
