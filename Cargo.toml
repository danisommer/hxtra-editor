[workspace]
resolver = "3"
members = ["crates/hxs-core", "crates/hxs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
hxs-core = { path = "crates/hxs-core" }
nusb = "0.2.9"
rmpv = "1.3.1"
rmp = "0.8.15"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
